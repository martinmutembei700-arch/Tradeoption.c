<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Martin Trade — Paper Trading</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f5f7fb;
  color:#172033;
}

header{
  background:#111827;
  color:white;
  padding:18px 20px;
}

header h1{
  margin:0;
  font-size:24px;
}

header p{
  margin:5px 0 0;
  font-size:13px;
  color:#cbd5e1;
}

main{
  max-width:1000px;
  margin:auto;
  padding:20px;
}

.dashboard{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:15px;
  margin-bottom:20px;
}

.card{
  background:white;
  padding:18px;
  border-radius:12px;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.card span{
  display:block;
  color:#64748b;
  font-size:13px;
  margin-bottom:8px;
}

.card strong{
  font-size:22px;
}

.section{
  background:white;
  padding:18px;
  border-radius:12px;
  margin-bottom:20px;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.section h2{
  margin-top:0;
}

#search{
  width:100%;
  padding:12px;
  border:1px solid #d1d5db;
  border-radius:8px;
  margin-bottom:15px;
  font-size:15px;
}

.stock{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:13px;
  border-bottom:1px solid #eee;
  cursor:pointer;
}

.stock:last-child{
  border-bottom:0;
}

.stock:hover{
  background:#f8fafc;
}

.symbol{
  font-weight:bold;
}

.stock-name{
  font-size:13px;
  color:#64748b;
  margin-top:3px;
}

.price{
  font-weight:bold;
}

.trade-box{
  display:grid;
  grid-template-columns:1fr 100px 100px 100px;
  gap:10px;
  align-items:center;
}

select,input{
  width:100%;
  padding:11px;
  border:1px solid #d1d5db;
  border-radius:8px;
  font-size:15px;
}

button{
  padding:11px;
  border:0;
  border-radius:8px;
  cursor:pointer;
  font-weight:bold;
}

.buy{
  background:#16a34a;
  color:white;
}

.sell{
  background:#dc2626;
  color:white;
}

table{
  width:100%;
  border-collapse:collapse;
}

th,td{
  padding:11px;
  text-align:left;
  border-bottom:1px solid #eee;
}

th{
  color:#64748b;
  font-size:13px;
}

.empty{
  color:#64748b;
}

.profit{
  font-weight:bold;
}

.notice{
  color:#64748b;
  font-size:13px;
  margin-top:12px;
}

@media(max-width:700px){
  .dashboard{
    grid-template-columns:1fr;
  }

  .trade-box{
    grid-template-columns:1fr 1fr;
  }

  .trade-box select{
    grid-column:1/-1;
  }

  table{
    font-size:13px;
  }
}
</style>
</head>

<body>

<header>
  <h1>Martin Trade</h1>
  <p>PAPER TRADING • VIRTUAL MONEY</p>
</header>

<main>

  <div class="dashboard">

    <div class="card">
      <span>Virtual Cash</span>
      <strong id="cash">$10,000.00</strong>
    </div>

    <div class="card">
      <span>Portfolio Value</span>
      <strong id="portfolioValue">$10,000.00</strong>
    </div>

    <div class="card">
      <span>Total P/L</span>
      <strong id="totalPL">$0.00</strong>
    </div>

  </div>

  <div class="section">
    <h2>Stocks</h2>

    <input
      id="search"
      type="text"
      placeholder="Search stocks..."
      oninput="renderStocks()"
    >

    <div id="stockList"></div>
  </div>

  <div class="section">

    <h2>Place Trade</h2>

    <div class="trade-box">

      <select id="symbol"></select>

      <input
        id="shares"
        type="number"
        min="1"
        value="1"
      >

      <button class="buy" onclick="trade('BUY')">
        BUY
      </button>

      <button class="sell" onclick="trade('SELL')">
        SELL
      </button>

    </div>

    <p class="notice">
      This is a simulation. No real money or real orders are used.
    </p>

  </div>

  <div class="section">

    <h2>Your Portfolio</h2>

    <div id="portfolio"></div>

  </div>

  <div class="section">

    <h2>Trade History</h2>

    <div id="history"></div>

  </div>

</main>

<script>

const stocks = [
  {symbol:"AAPL",name:"Apple",price:255.00},
  {symbol:"MSFT",name:"Microsoft",price:530.00},
  {symbol:"NVDA",name:"NVIDIA",price:180.00},
  {symbol:"TSLA",name:"Tesla",price:450.00},
  {symbol:"AMZN",name:"Amazon",price:225.00},
  {symbol:"GOOGL",name:"Alphabet",price:245.00}
];

let cash = 10000;
let start = 10000;
let holdings = {};
let trades = [];

function money(n){
  return "$" + Number(n).toFixed(2);
}

function renderStocks(){

  const list = document.getElementById("stockList");
  const search = document.getElementById("search").value.toLowerCase();

  list.innerHTML = "";

  stocks
    .filter(s =>
      s.symbol.toLowerCase().includes(search) ||
      s.name.toLowerCase().includes(search)
    )
    .forEach(s => {

      const div = document.createElement("div");

      div.className = "stock";

      div.innerHTML = `
        <div>
          <div class="symbol">${s.symbol}</div>
          <div class="stock-name">${s.name}</div>
        </div>

        <div class="price">
          ${money(s.price)}
        </div>
      `;

      div.onclick = function(){
        document.getElementById("symbol").value = s.symbol;
      };

      list.appendChild(div);

    });
}

function setup(){

  const select = document.getElementById("symbol");

  stocks.forEach(s => {

    const option = document.createElement("option");

    option.value = s.symbol;
    option.textContent = s.symbol;

    select.appendChild(option);

  });

  renderStocks();
  render();

}

function trade(side){

  const symbol = document.getElementById("symbol").value;

  const shares = Number(
    document.getElementById("shares").value
  );

  const stock = stocks.find(
    s => s.symbol === symbol
  );

  if(!stock || shares <= 0){
    alert("Enter a valid number of shares.");
    return;
  }

  const value = stock.price * shares;

  if(side === "BUY"){

    if(value > cash){

      alert("Not enough virtual cash.");

      return;
    }

    cash -= value;

    holdings[symbol] =
      (holdings[symbol] || 0) + shares;

    trades.unshift({

      type:"BUY",
      symbol:symbol,
      shares:shares,
      price:stock.price,
      time:new Date().toLocaleString()

    });

  }

  if(side === "SELL"){

    if((holdings[symbol] || 0) < shares){

      alert("You don't own enough shares.");

      return;
    }

    cash += value;

    holdings[symbol] -= shares;

    if(holdings[symbol] <= 0){
      delete holdings[symbol];
    }

    trades.unshift({

      type:"SELL",
      symbol:symbol,
      shares:shares,
      price:stock.price,
      time:new Date().toLocaleString()

    });

  }

  render();

}

function render(){

  let portfolioValue = cash;

  let portfolioHTML = "";

  const ownedSymbols = Object.keys(holdings);

  if(ownedSymbols.length === 0){

    portfolioHTML =
      `<p class="empty">
        No stocks yet. Choose a stock and press BUY.
      </p>`;

  }else{

    portfolioHTML = `
      <table>
        <tr>
          <th>Stock</th>
          <th>Shares</th>
          <th>Price</th>
          <th>Value</th>
        </tr>
    `;

    ownedSymbols.forEach(symbol => {

      const stock =
        stocks.find(s => s.symbol === symbol);

      const shares = holdings[symbol];

      const value = shares * stock.price;

      portfolioValue += value;

      portfolioHTML += `
        <tr>
          <td>${symbol}</td>
          <td>${shares}</td>
          <td>${money(stock.price)}</td>
          <td>${money(value)}</td>
        </tr>
      `;

    });

    portfolioHTML += "</table>";

  }

  const totalPL = portfolioValue - start;

  document.getElementById("cash").textContent =
    money(cash);

  document.getElementById("portfolioValue").textContent =
    money(portfolioValue);

  document.getElementById("totalPL").textContent =
    (totalPL >= 0 ? "+" : "") + money(totalPL);

  document.getElementById("portfolio").innerHTML =
    portfolioHTML;

  renderHistory();

}

function renderHistory(){

  const history =
    document.getElementById("history");

  if(trades.length === 0){

    history.innerHTML =
      `<p class="empty">
        No trades yet.
      </p>`;

    return;
  }

  let html = `
    <table>

      <tr>
        <th>Type</th>
        <th>Stock</th>
        <th>Shares</th>
        <th>Price</th>
        <th>Time</th>
      </tr>
  `;

  trades.forEach(t => {

    html += `
      <tr>

        <td class="profit">
          ${t.type}
        </td>

        <td>${t.symbol}</td>

        <td>${t.shares}</td>

        <td>${money(t.price)}</td>

        <td>${t.time}</td>

      </tr>
    `;

  });

  html += "</table>";

  history.innerHTML = html;

}

setInterval(function(){

  stocks.forEach(function(s){

    const change =
      (Math.random() - 0.5) * 2;

    s.price =
      Math.max(1, s.price + change);

  });

  renderStocks();
  render();

},5000);

setup();

</script>

</body>
</html>
