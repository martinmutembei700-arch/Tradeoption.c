<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Martin Trade</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f4f6f8;
color:#172033
}

header{
background:#111827;
color:white;
padding:18px;
text-align:center
}

header h1{margin:0 0 5px}
header p{margin:0;color:#cbd5e1}

main{
max-width:850px;
margin:auto;
padding:12px
}

.card{
background:white;
padding:16px;
margin:12px 0;
border-radius:12px;
box-shadow:0 2px 8px #ddd
}

.account{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px
}

.accountBox{
background:#f8fafc;
padding:12px;
border-radius:8px
}

.accountBox b{
display:block;
font-size:13px;
color:#64748b;
margin-bottom:5px
}

.accountBox span{
font-size:20px;
font-weight:bold
}

input,select,button{
width:100%;
padding:12px;
margin:5px 0;
border-radius:7px;
border:1px solid #cbd5e1;
font-size:15px
}

button{
border:0;
color:white;
font-weight:bold
}

.buy{background:#16a34a}
.sell{background:#dc2626}
.reset{background:#555}

.stock{
display:inline-block;
width:31%;
padding:10px;
background:#f8fafc;
margin:1%;
border-radius:8px
}

.stock b{
font-size:15px
}

.stockPrice{
font-weight:bold;
margin-top:5px
}

.chartHeader{
display:flex;
justify-content:space-between;
align-items:center;
gap:10px
}

.chartHeader select{
width:48%
}

.price{
text-align:center;
font-size:26px;
font-weight:bold;
margin:5px
}

.up{color:#16a34a}
.down{color:#dc2626}

.chartbox{
width:100%;
overflow:hidden
}

canvas{
display:block;
width:100%;
height:350px;
border:1px solid #ddd;
border-radius:8px;
background:white
}

.ohlc{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:5px;
margin:10px 0
}

.ohlc div{
background:#f8fafc;
padding:8px;
border-radius:6px;
text-align:center;
font-size:12px
}

.ohlc b{
display:block;
font-size:13px;
margin-top:3px
}

.chartButtons{
display:grid;
grid-template-columns:1fr 1fr;
gap:8px
}

.tradeInfo{
background:#f8fafc;
padding:10px;
border-radius:8px;
margin-top:8px
}

.historyRow{
padding:9px 0;
border-bottom:1px solid #eee
}

.profit{
font-weight:bold
}

.small{
text-align:center;
color:#64748b;
font-size:12px
}

@media(max-width:600px){

.account{
grid-template-columns:1fr 1fr
}

.stock{
width:47%
}

.ohlc{
grid-template-columns:1fr 1fr
}

.chartHeader{
display:block
}

.chartHeader select{
width:100%
}

}
</style>
</head>

<body>

<header>
<h1>Martin Trade</h1>
<p>Paper Trading • Virtual Money</p>
</header>

<main>

<!-- ACCOUNT -->

<div class="card">

<h2>Account</h2>

<div class="account">

<div class="accountBox">
<b>Available Cash</b>
<span>$<span id="cash">10000.00</span></span>
</div>

<div class="accountBox">
<b>Equity</b>
<span>$<span id="equity">10000.00</span></span>
</div>

<div class="accountBox">
<b>Open Positions</b>
<span id="positionCount">0</span>
</div>

<div class="accountBox">
<b>Total P/L</b>
<span id="profit">$0.00</span>
</div>

</div>

</div>


<!-- STOCKS -->

<div class="card">

<h2>Markets</h2>

<div id="stocks"></div>

</div>


<!-- CHART -->

<div class="card">

<div class="chartHeader">

<h2>Market Chart</h2>

<select id="chartStock" onchange="drawChart()">

<option>AAPL</option>
<option>MSFT</option>
<option>NVDA</option>
<option>TSLA</option>
<option>AMZN</option>
<option>GOOGL</option>

</select>

</div>

<div id="chartPrice" class="price">
$256.77
</div>

<div class="ohlc">

<div>
Open
<b id="openPrice">-</b>
</div>

<div>
High
<b id="highPrice">-</b>
</div>

<div>
Low
<b id="lowPrice">-</b>
</div>

<div>
Close
<b id="closePrice">-</b>
</div>

</div>

<div class="chartbox">

<canvas id="chart"></canvas>

</div>

<p class="small">
Simulated market • New candle every 5 seconds
</p>

<!-- DIRECT CHART TRADING -->

<div class="chartButtons">

<button class="buy" onclick="chartTrade('BUY')">
BUY
</button>

<button class="sell" onclick="chartTrade('SELL')">
SELL
</button>

</div>

</div>


<!-- PLACE TRADE -->

<div class="card">

<h2>Place Trade</h2>

<select id="symbol">

<option>AAPL</option>
<option>MSFT</option>
<option>NVDA</option>
<option>TSLA</option>
<option>AMZN</option>
<option>GOOGL</option>

</select>

<input
id="shares"
type="number"
min="1"
value="1"
>

<button class="buy" onclick="trade('BUY')">
BUY
</button>

<button class="sell" onclick="trade('SELL')">
SELL
</button>

</div>


<!-- PORTFOLIO -->

<div class="card">

<h2>Portfolio</h2>

<div id="portfolioList">
No positions
</div>

</div>


<!-- HISTORY -->

<div class="card">

<h2>Trade History</h2>

<div id="history">
No trades
</div>

</div>


<!-- RESET -->

<div class="card">

<button class="reset" onclick="resetAccount()">
Reset Account to $10,000
</button>

</div>

</main>


<script>

/* =========================
   STARTING PRICES
========================= */

const startingPrices={

AAPL:256.77,
MSFT:521.90,
NVDA:180.24,
TSLA:447.96,
AMZN:232.11,
GOOGL:246.85

};


/* =========================
   ACCOUNT
========================= */

let cash=10000;

let prices={
...startingPrices
};

let holdings={};

let trades=[];

let candles={};


/* =========================
   CREATE CANDLES
========================= */

function createInitialCandles(price){

let list=[];

let current=price;

for(let i=0;i<35;i++){

let open=current;

let change=(Math.random()-.5)*3;

let close=Math.max(
1,
open+change
);

let high=Math.max(
open,
close
)+Math.random()*1.2;

let low=Math.min(
open,
close
)-Math.random()*1.2;

list.push({

open:open,
high:high,
low:low,
close:close

});

current=close;

}

return list;

}


function initializeCandles(){

candles={};

for(let s in prices){

candles[s]=
createInitialCandles(
prices[s]
);

prices[s]=
candles[s][
candles[s].length-1
].close;

}

}


/* =========================
   MONEY
========================= */

function money(n){

return Number(n).toFixed(2);

}


/* =========================
   ACCOUNT RENDER
========================= */

function render(){

document.getElementById("cash")
.textContent=
money(cash);


let stockValue=0;

let positionCount=0;


for(let s in holdings){

stockValue+=
holdings[s]*prices[s];

positionCount+=
holdings[s];

}


let equity=
cash+stockValue;


document.getElementById("equity")
.textContent=
money(equity);


document.getElementById("profit")
.textContent=
"$"+money(equity-10000);


document.getElementById("positionCount")
.textContent=
positionCount;


/* STOCKS */

let stocks="";


for(let s in prices){

stocks+=`

<div class="stock">

<b>${s}</b>

<div class="stockPrice">
$${money(prices[s])}
</div>

</div>

`;

}


document.getElementById("stocks")
.innerHTML=
stocks;


/* PORTFOLIO */

let portfolioHTML="";


for(let s in holdings){

let shares=
holdings[s];

let value=
shares*prices[s];

portfolioHTML+=`

<div class="tradeInfo">

<b>${s}</b><br>

Shares: ${shares}<br>

Current Price:
$${money(prices[s])}<br>

Market Value:
$${money(value)}

</div>

`;

}


document.getElementById("portfolioList")
.innerHTML=
portfolioHTML||
"No positions";


/* HISTORY */

let historyHTML="";


trades
.slice()
.reverse()
.forEach(t=>{

let pl="";

if(t.action==="SELL"){

pl=
`<span class="profit">
Realized P/L: $${money(t.pl)}
</span>`;

}

historyHTML+=`

<div class="historyRow">

<b>${t.action}</b>
${t.shares}
${t.symbol}
@ $${money(t.price)}

<br>

${pl}

</div>

`;

});


document.getElementById("history")
.innerHTML=
historyHTML||
"No trades";


save();

drawChart();

}


/* =========================
   NORMAL TRADE
========================= */

function trade(action){

let symbol=
document.getElementById("symbol")
.value;

let shares=
Number(
document.getElementById("shares")
.value
);

executeTrade(
action,
symbol,
shares
);

}


/* =========================
   CHART TRADE
========================= */

function chartTrade(action){

let symbol=
document.getElementById("chartStock")
.value;

let shares=
Number(
document.getElementById("shares")
.value
)||1;

executeTrade(
action,
symbol,
shares
);


/* Keep symbol selectors together */

document.getElementById("symbol")
.value=
symbol;

}


/* =========================
   EXECUTE TRADE
========================= */

function executeTrade(
action,
symbol,
shares
){

let price=
prices[symbol];


if(shares<1){

alert(
"Enter at least 1 share"
);

return;

}


/* BUY */

if(action==="BUY"){

if(
price*shares>cash
){

alert(
"Not enough cash"
);

return;

}


cash-=
price*shares;


holdings[symbol]=
(holdings[symbol]||0)+
shares;


trades.push({

action:"BUY",

symbol:symbol,

shares:shares,

price:price,

pl:0

});

}


/* SELL */

else{

if(
!holdings[symbol]||
holdings[symbol]<shares
){

alert(
"You don't own enough shares"
);

return;

}


/*
Calculate average BUY price
*/

let buys=
trades.filter(t=>
t.symbol===symbol&&
t.action==="BUY"
);


let totalShares=0;

let totalCost=0;


buys.forEach(t=>{

totalShares+=
t.shares;

totalCost+=
t.shares*t.price;

});


let averageBuy=
totalShares?
totalCost/totalShares:
price;


let pl=
(price-averageBuy)*
shares;


cash+=
price*shares;


holdings[symbol]-=
shares;


if(holdings[symbol]===0){

delete holdings[symbol];

}


trades.push({

action:"SELL",

symbol:symbol,

shares:shares,

price:price,

pl:pl

});

}


render();

}


/* =========================
   MARKET UPDATE
========================= */

function updatePrices(){

for(let s in prices){

let oldPrice=
prices[s];

let open=
oldPrice;


/* Random market movement */

let movement=
(Math.random()-.5)*3;


let close=
Math.max(
1,
open+movement
);


let high=
Math.max(
open,
close
)+
Math.random()*1.2;


let low=
Math.min(
open,
close
)-
Math.random()*1.2;


candles[s].push({

open:open,

high:high,

low:low,

close:close

});


if(candles[s].length>40){

candles[s].shift();

}


prices[s]=close;

}


render();

}


/* =========================
   DRAW CANDLESTICK CHART
========================= */

function drawChart(){

let canvas=
document.getElementById("chart");

let ctx=
canvas.getContext("2d");


let symbol=
document.getElementById(
"chartStock"
).value;


let data=
candles[symbol];


if(!data||!data.length){

return;

}


let width=
canvas.clientWidth;

let height=350;


canvas.width=
width*2;

canvas.height=
height*2;


ctx.setTransform(
2,0,0,2,0,0
);


let w=width;

let h=height;


ctx.clearRect(
0,
0,
w,
h
);


/* MIN/MAX */

let min=
Math.min(
...data.map(c=>c.low)
);

let max=
Math.max(
...data.map(c=>c.high)
);


let range=
max-min||1;


min-=
range*.08;

max+=
range*.08;


range=
max-min;


let left=10;

let right=65;

let top=20;

let bottom=35;


let chartWidth=
w-left-right;

let chartHeight=
h-top-bottom;


/* GRID */

ctx.strokeStyle=
"#e5e7eb";

ctx.lineWidth=1;


for(let i=0;i<6;i++){

let y=
top+
chartHeight/5*i;


ctx.beginPath();

ctx.moveTo(
left,
y
);

ctx.lineTo(
w-right,
y
);

ctx.stroke();


let price=
max-
range/5*i;


ctx.fillStyle=
"#64748b";

ctx.font=
"11px Arial";


ctx.fillText(
"$"+money(price),
w-right+5,
y+4
);

}


/* TIME GRID */

for(let i=0;i<5;i++){

let x=
left+
chartWidth/4*i;


ctx.strokeStyle=
"#eeeeee";


ctx.beginPath();

ctx.moveTo(
x,
top
);

ctx.lineTo(
x,
h-bottom
);

ctx.stroke();


ctx.fillStyle=
"#64748b";

ctx.font=
"10px Arial";


ctx.fillText(
(i*10)+"s",
x-8,
h-10
);

}


/* CANDLE WIDTH */

let candleWidth=
chartWidth/data.length;


/* DRAW CANDLES */

data.forEach(
(c,i)=>{

let x=
left+
i*candleWidth+
candleWidth/2;


let yOpen=
top+
(max-c.open)/
range*
chartHeight;


let yClose=
top+
(max-c.close)/
range*
chartHeight;


let yHigh=
top+
(max-c.high)/
range*
chartHeight;


let yLow=
top+
(max-c.low)/
range*
chartHeight;


let rising=
c.close>=c.open;


let candleColor=
rising?
"#16a34a":
"#dc2626";


/* WICK */

ctx.strokeStyle=
candleColor;

ctx.lineWidth=1.5;


ctx.beginPath();

ctx.moveTo(
x,
yHigh
);

ctx.lineTo(
x,
yLow
);

ctx.stroke();


/* BODY */

let bodyTop=
Math.min(
yOpen,
yClose
);

let bodyHeight=
Math.max(
2,
Math.abs(
yClose-yOpen
)
);


let bodyWidth=
Math.max(
4,
candleWidth*.65
);


ctx.fillStyle=
candleColor;


ctx.fillRect(
x-bodyWidth/2,
bodyTop,
bodyWidth,
bodyHeight
);

});


/* CURRENT PRICE */

let last=
data[data.length-1];

let current=
last.close;


let currentY=
top+
(max-current)/
range*
chartHeight;


let first=
data[0].open;


let rising=
current>=first;


let color=
rising?
"#16a34a":
"#dc2626";


/* PRICE LINE */

ctx.strokeStyle=color;

ctx.lineWidth=1;

ctx.setLineDash([
5,
5
]);


ctx.beginPath();

ctx.moveTo(
left,
currentY
);

ctx.lineTo(
w-right,
currentY
);

ctx.stroke();


ctx.setLineDash([]);


/* PRICE LABEL */

ctx.fillStyle=color;


ctx.fillRect(
w-right,
currentY-10,
60,
20
);


ctx.fillStyle="white";

ctx.font=
"bold 11px Arial";


ctx.fillText(
"$"+money(current),
w-right+4,
currentY+4
);


/* PRICE ABOVE CHART */

let priceElement=
document.getElementById(
"chartPrice"
);


priceElement.textContent=
"$"+money(current);


priceElement.className=
"price "+
(rising?"up":"down");


/* OHLC */

document.getElementById(
"openPrice"
).textContent=
"$"+money(last.open);


document.getElementById(
"highPrice"
).textContent=
"$"+money(last.high);


document.getElementById(
"lowPrice"
).textContent=
"$"+money(last.low);


document.getElementById(
"closePrice"
).textContent=
"$"+money(last.close);

}


/* =========================
   SAVE
========================= */

function save(){

localStorage.setItem(
"martinTrade",
JSON.stringify({

cash:cash,

holdings:holdings,

trades:trades,

prices:prices,

candles:candles

})
);

}


/* =========================
   LOAD
========================= */

function load(){

let saved=
localStorage.getItem(
"martinTrade"
);


if(saved){

try{

let data=
JSON.parse(saved);


cash=
data.cash??
10000;


holdings=
data.holdings||
{};


trades=
data.trades||
[];


prices=
data.prices||
{...startingPrices};


candles=
data.candles||
{};


for(let s in prices){

if(
!candles[s]||
!candles[s].length
){

candles[s]=
createInitialCandles(
prices[s]
);

}

}

}catch(e){

cash=10000;

holdings={};

trades=[];

prices={
...startingPrices
};

initializeCandles();

}

}

else{

initializeCandles();

}

}


/* =========================
   COMPLETE RESET
========================= */

function resetAccount(){

if(
confirm(
"Reset account to $10,000 and erase all trades?"
)
){

localStorage.removeItem(
"martinTrade"
);


cash=10000;

holdings={};

trades=[];

prices={
...startingPrices
};

initializeCandles();

render();

}

}


/* START */

load();

render();


/* NEW CANDLE EVERY 5 SECONDS */

setInterval(
updatePrices,
5000
);

</script>

</body>
 </html>
