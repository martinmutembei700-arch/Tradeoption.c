<script>
const initialPrices = {
  AAPL: 222.23,
  MSFT: 507.53,
  NVDA: 173.85,
  TSLA: 444.93,
  AMZN: 214.69,
  GOOGL: 260.05
};

const names = {
  AAPL: "Apple Inc.",
  MSFT: "Microsoft Corp.",
  NVDA: "NVIDIA Corp.",
  TSLA: "Tesla Inc.",
  AMZN: "Amazon.com Inc.",
  GOOGL: "Alphabet Inc."
};

let prices = {...initialPrices};
let cash = 10000;

let positions = {
  AAPL: 0,
  MSFT: 0,
  NVDA: 0,
  TSLA: 0,
  AMZN: 0,
  GOOGL: 0
};

let history = [];
let selected = "AAPL";
let series = {};

const marketsEl = document.getElementById("markets");
const cashEl = document.getElementById("cash");
const equityEl = document.getElementById("equity");
const pnlEl = document.getElementById("pnl");
const chartEl = document.getElementById("chart");
const chartTitleEl = document.getElementById("chartTitle");
const positionEl = document.getElementById("position");
const positionValueEl = document.getElementById("positionValue");
const selectedSymbolEl = document.getElementById("selectedSymbol");
const selectedPriceEl = document.getElementById("selectedPrice");
const quantityEl = document.getElementById("quantity");
const historyEl = document.getElementById("history");
const toastEl = document.getElementById("toast");

function makeSeries(base) {
  const values = [];
  let price = base;

  for (let i = 0; i < 30; i++) {
    price *= 1 + (Math.random() - 0.48) * 0.012;
    values.push(price);
  }

  values[29] = base;
  return values;
}

Object.keys(prices).forEach(symbol => {
  series[symbol] = makeSeries(prices[symbol]);
});

function money(value) {
  return "$" + Number(value).toLocaleString("en-US", {
    minimumFractionDigits: 2,
    maximumFractionDigits: 2
  });
}

function renderMarkets() {
  marketsEl.innerHTML = Object.keys(prices).map(symbol => {

    const change =
      ((prices[symbol] - initialPrices[symbol]) /
      initialPrices[symbol]) * 100;

    return `
      <div class="market ${symbol === selected ? "active" : ""}"
           data-symbol="${symbol}">

        <div class="market-top">

          <div>
            <div class="symbol">${symbol}</div>
            <div class="company">${names[symbol]}</div>
          </div>

          <div class="price">
            ${money(prices[symbol])}
          </div>

        </div>

        <div class="change ${change >= 0 ? "positive" : "negative"}">
          ${change >= 0 ? "+" : ""}${change.toFixed(2)}%
        </div>

      </div>
    `;

  }).join("");

  document.querySelectorAll(".market").forEach(card => {
    card.addEventListener("click", function() {
      selectStock(this.dataset.symbol);
    });
  });
}

function selectStock(symbol) {
  selected = symbol;

  chartTitleEl.textContent =
    symbol + " — " + names[symbol];

  selectedSymbolEl.textContent = symbol;
  selectedPriceEl.textContent = money(prices[symbol]);

  renderMarkets();
  render();
}

function accountValue() {
  let total = cash;

  Object.keys(positions).forEach(symbol => {
    total += positions[symbol] * prices[symbol];
  });

  return total;
}

function render() {

  const equity = accountValue();
  const profitLoss = equity - 10000;

  cashEl.textContent = money(cash);
  equityEl.textContent = money(equity);

  pnlEl.textContent =
    (profitLoss >= 0 ? "+" : "") + money(profitLoss);

  pnlEl.className =
    "value " + (profitLoss >= 0 ? "positive" : "negative");

  positionEl.textContent = positions[selected];

  positionValueEl.textContent =
    money(positions[selected] * prices[selected]);

  selectedPriceEl.textContent =
    money(prices[selected]);

  renderHistory();
  drawChart();
}

function trade(action) {

  const quantity =
    Math.floor(Number(quantityEl.value));

  if (!quantity || quantity < 1) {
    showToast("Enter a valid quantity");
    return;
  }

  const price = prices[selected];
  const total = quantity * price;

  if (action === "buy") {

    if (total > cash) {
      showToast("Not enough cash");
      return;
    }

    cash -= total;
    positions[selected] += quantity;

  } else {

    if (quantity > positions[selected]) {
      showToast("Not enough shares to sell");
      return;
    }

    cash += total;
    positions[selected] -= quantity;
  }

  history.unshift({
    time: new Date().toLocaleTimeString(),
    action: action.toUpperCase(),
    symbol: selected,
    qty: quantity,
    price: price,
    total: total
  });

  save();
  render();

  if (action === "buy") {
    showToast("BUY order simulated");
  } else {
    showToast("SELL order simulated");
  }
}

function renderHistory() {

  if (history.length === 0) {

    historyEl.innerHTML = `
      <tr>
        <td colspan="6" class="empty">
          No trades yet.
        </td>
      </tr>
    `;

    return;
  }

  historyEl.innerHTML = history.map(tradeItem => `
    <tr>

      <td>${tradeItem.time}</td>

      <td class="${tradeItem.action === "BUY"
        ? "positive"
        : "negative"}">
        ${tradeItem.action}
      </td>

      <td>${tradeItem.symbol}</td>

      <td>${tradeItem.qty}</td>

      <td>${money(tradeItem.price)}</td>

      <td>${money(tradeItem.total)}</td>

    </tr>
  `).join("");
}

function drawChart() {

  const canvas = chartEl;
  const box = canvas.parentElement;

  const dpr = window.devicePixelRatio || 1;

  const width = Math.max(100, box.clientWidth - 16);
  const height = Math.max(100, box.clientHeight - 16);

  canvas.width = width * dpr;
  canvas.height = height * dpr;

  const ctx = canvas.getContext("2d");

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  ctx.clearRect(0, 0, width, height);

  const data = series[selected];

  const min = Math.min(...data);
  const max = Math.max(...data);

  const range = max - min || 1;

  ctx.beginPath();

  data.forEach((value, index) => {

    const x =
      index * width / (data.length - 1);

    const y =
      height - 10 -
      ((value - min) / range) *
      (height - 20);

    if (index === 0) {
      ctx.moveTo(x, y);
    } else {
      ctx.lineTo(x, y);
    }

  });

  ctx.strokeStyle = "#2563eb";
  ctx.lineWidth = 2;
  ctx.stroke();
}

function save() {

  localStorage.setItem(
    "martinTrade",
    JSON.stringify({
      cash: cash,
      positions: positions,
      history: history
    })
  );
}

function load() {

  try {

    const saved =
      JSON.parse(
        localStorage.getItem("martinTrade")
      );

    if (saved) {

      if (typeof saved.cash === "number") {
        cash = saved.cash;
      }

      if (saved.positions) {
        positions = {
          ...positions,
          ...saved.positions
        };
      }

      if (Array.isArray(saved.history)) {
        history = saved.history;
      }
    }

  } catch (error) {
    console.log(error);
  }
}

function resetAccount() {

  if (!confirm(
    "Reset the paper-trading account to $10,000?"
  )) {
    return;
  }

  cash = 10000;

  positions = {
    AAPL: 0,
    MSFT: 0,
    NVDA: 0,
    TSLA: 0,
    AMZN: 0,
    GOOGL: 0
  };

  history = [];

  save();
  render();

  showToast("Account reset");
}

function showToast(message) {

  toastEl.textContent = message;
  toastEl.style.display = "block";

  clearTimeout(window.toastTimer);

  window.toastTimer = setTimeout(function() {
    toastEl.style.display = "none";
  }, 2200);
}

/* BUTTONS */

const buyButton =
  document.querySelector(".buy");

const sellButton =
  document.querySelector(".sell");

const resetButton =
  document.querySelector(".secondary");

buyButton.addEventListener("click", function() {
  trade("buy");
});

sellButton.addEventListener("click", function() {
  trade("sell");
});

resetButton.addEventListener("click", function() {
  resetAccount();
});

/* START APP */

load();
renderMarkets();
render();

window.addEventListener("resize", drawChart);
                                               </script>
