<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Martin Trade — Paper Trading</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f5f7fb;
  color:#172033;
}

header{
  background:#111827;
  color:white;
  padding:18px;
}

header h1{
  margin:0 0 5px;
  font-size:23px;
}

header p{
  margin:0;
  opacity:.75;
  font-size:13px;
}

.container{
  max-width:1000px;
  margin:auto;
  padding:15px;
}

.cards{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin-bottom:15px;
}

.card{
  background:white;
  border-radius:12px;
  padding:15px;
  box-shadow:0 2px 8px #00000012;
}

.card small{
  color:#6b7280;
}

.card strong{
  display:block;
  font-size:21px;
  margin-top:5px;
}

.section{
  background:white;
  border-radius:12px;
  padding:15px;
  margin-bottom:15px;
  box-shadow:0 2px 8px #00000012;
}

.section h2{
  margin:0 0 12px;
  font-size:18px;
}

.stocks{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}

.stock{
  border:1px solid #e5e7eb;
  border-radius:10px;
  padding:12px;
  cursor:pointer;
}

.stock:hover{
  border-color:#2563eb;
}

.stock b{
  font-size:17px;
}

.price{
  font-size:18px;
  margin-top:5px;
}

.up{
  color:#15803d;
}

.down{
  color:#dc2626;
}

.chartBox{
  position:relative;
  width:100%;
  height:390px;
  border:1px solid #e5e7eb;
  border-radius:10px;
  overflow:hidden;
  background:#fff;
}

canvas{
  width:100%;
  height:100%;
  display:block;
}

.chartTop{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:10px;
}

.chartPrice{
  font-weight:bold;
  font-size:18px;
}

.controls{
  display:grid;
  grid-template-columns:1fr 100px;
  gap:10px;
  margin-top:12px;
}

select,
input{
  width:100%;
  padding:12px;
  border:1px solid #d1d5db;
  border-radius:8px;
  font-size:15px;
  background:white;
}

button{
  border:0;
  border-radius:8px;
  padding:12px 15px;
  font-weight:bold;
  cursor:pointer;
}

.buy{
  background:#16a34a;
  color:white;
}

.sell{
  background:#dc2626;
  color:white;
}

.reset{
  background:#111827;
  color:white;
}

.gray{
  background:#e5e7eb;
}

.tradeButtons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:10px;
}

.riskGrid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.position{
  border:1px solid #e5e7eb;
  border-radius:10px;
  padding:12px;
  margin-bottom:10px;
}

.positionHead{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.position b{
  font-size:18px;
}

.positionGrid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
  margin-top:10px;
}

.stat{
  background:#f9fafb;
  padding:9px;
  border-radius:7px;
}

.stat small{
  display:block;
  color:#6b7280;
  margin-bottom:3px;
}

.history{
  border-bottom:1px solid #e5e7eb;
  padding:10px 0;
}

.history:last-child{
  border-bottom:0;
}

.profit{
  color:#15803d;
  font-weight:bold;
}

.loss{
  color:#dc2626;
  font-weight:bold;
}

.notice{
  background:#fff7ed;
  border:1px solid #fed7aa;
  border-radius:8px;
  padding:10px;
  font-size:13px;
  margin-top:10px;
}

.empty{
  color:#6b7280;
  text-align:center;
  padding:15px;
}

@media(max-width:650px){

  .cards{
    grid-template-columns:1fr;
  }

  .stocks{
    grid-template-columns:repeat(2,1fr);
  }

  .positionGrid{
    grid-template-columns:1fr 1fr;
  }

  .chartBox{
    height:330px;
  }
}
</style>
</head>

<body>

<header>
  <h1>Martin Trade</h1>
  <p>Paper Trading Simulator — Simulated Market</p>
</header>

<div class="container">

  <div class="cards">

    <div class="card">
      <small>Available Cash</small>
      <strong id="cash">$10,000.00</strong>
    </div>

    <div class="card">
      <small>Equity</small>
      <strong id="equity">$10,000.00</strong>
    </div>

    <div class="card">
      <small>Total P/L</small>
      <strong id="totalPL">$0.00</strong>
    </div>

  </div>

  <div class="section">

    <h2>Markets</h2>

    <div class="stocks" id="stocks"></div>

  </div>

  <div class="section">

    <div class="chartTop">

      <div>
        <h2 id="chartTitle">AAPL</h2>
        <div class="chartPrice" id="chartPrice">$0.00</div>
      </div>

      <select id="chartSymbol" onchange="changeChart()">
        <option>AAPL</option>
        <option>MSFT</option>
        <option>NVDA</option>
        <option>TSLA</option>
        <option>AMZN</option>
        <option>GOOGL</option>
      </select>

    </div>

    <div class="chartBox">
      <canvas id="chart"></canvas>
    </div>

    <div id="ohlc" style="margin-top:10px;font-size:13px"></div>

    <div class="tradeButtons">

      <button class="buy" onclick="chartTrade('BUY')">
        BUY
      </button>

      <button class="sell" onclick="chartTrade('SELL')">
        SELL
      </button>

    </div>

  </div>

  <div class="section">

    <h2>Place Trade</h2>

    <div class="controls">

      <select id="tradeSymbol">
        <option>AAPL</option>
        <option>MSFT</option>
        <option>NVDA</option>
        <option>TSLA</option>
        <option>AMZN</option>
        <option>GOOGL</option>
      </select>

      <input
        id="shares"
        type="number"
        min="1"
        value="1"
        placeholder="Shares"
      >

    </div>

    <div class="tradeButtons">

      <button class="buy" onclick="trade('BUY')">
        BUY
      </button>

      <button class="sell" onclick="trade('SELL')">
        SELL
      </button>

    </div>

    <div class="notice">
      Trades use simulated prices. This website does not use real money.
    </div>

  </div>

  <div class="section">

    <h2>Risk Management</h2>

    <div class="riskGrid">

      <div>
        <small>Stop Loss ($)</small>
        <input
          id="stopLoss"
          type="number"
          step="0.01"
          placeholder="Example: 240.00"
        >
      </div>

      <div>
        <small>Take Profit ($)</small>
        <input
          id="takeProfit"
          type="number"
          step="0.01"
          placeholder="Example: 270.00"
        >
      </div>

    </div>

    <button
      class="gray"
      style="margin-top:10px;width:100%"
      onclick="saveRisk()"
    >
      Save Risk Settings
    </button>

    <div
      id="riskMessage"
      style="margin-top:8px;font-size:13px"
    ></div>

  </div>

  <div class="section">

    <h2>Open Positions</h2>

    <div id="positions"></div>

  </div>

  <div class="section">

    <h2>Trade History</h2>

    <div id="history"></div>

  </div>

  <div class="section">

    <button
      class="reset"
      style="width:100%"
      onclick="resetAccount()"
    >
      Reset Account to $10,000
    </button>

  </div>

</div>

<script>

const startingPrices={
  AAPL:256.77,
  MSFT:521.90,
  NVDA:180.24,
  TSLA:447.96,
  AMZN:232.11,
  GOOGL:246.85
};

const symbols=Object.keys(startingPrices);

let cash=10000;
let prices={...startingPrices};
let holdings={};
let trades=[];
let candles={};
let costBasis={};

let risk={
  stopLoss:{},
  takeProfit:{}
};

let chartSymbol="AAPL";


function money(n){

  return "$"+Number(n||0).toFixed(2);

}


function createInitialCandles(price){

  const arr=[];
  let p=price;

  for(let i=0;i<35;i++){

    const open=p;

    const change=
      (Math.random()-.5)*4;

    const close=
      Math.max(
        1,
        open+change
      );

    const high=
      Math.max(open,close)+
      Math.random()*2;

    const low=
      Math.max(
        1,
        Math.min(open,close)-
        Math.random()*2
      );

    arr.push({
      open,
      high,
      low,
      close
    });

    p=close;

  }

  return arr;

}


function initializeCandles(){

  symbols.forEach(s=>{

    if(!candles[s]){

      candles[s]=
        createInitialCandles(
          startingPrices[s]
        );

    }

    prices[s]=
      candles[s][
        candles[s].length-1
      ].close;

  });

}


function save(){

  localStorage.setItem(
    "martinTrade",
    JSON.stringify({
      cash,
      prices,
      holdings,
      trades,
      candles,
      costBasis,
      risk
    })
  );

}


function load(){

  const saved=
    localStorage.getItem(
      "martinTrade"
    );

  if(saved){

    try{

      const data=
        JSON.parse(saved);

      cash=
        data.cash ??
        10000;

      prices=
        data.prices ||
        {...startingPrices};

      holdings=
        data.holdings ||
        {};

      trades=
        data.trades ||
        [];

      candles=
        data.candles ||
        {};

      costBasis=
        data.costBasis ||
        {};

      risk=
        data.risk ||
        {
          stopLoss:{},
          takeProfit:{}
        };

    }catch(e){

      console.log(
        "Load error",
        e
      );

    }

  }

  initializeCandles();

  repairOldTrades();

}


function repairOldTrades(){

  trades.forEach(t=>{

    if(
      t.action==="SELL" &&
      (!Number.isFinite(
        Number(t.pl)
      ))
    ){

      let buys=
        trades.filter(x=>
          x.symbol===t.symbol &&
          x.action==="BUY"
        );

      let totalCost=0;
      let remaining=t.shares;

      for(const b of buys){

        if(remaining<=0)
          break;

        const qty=
          Math.min(
            remaining,
            b.shares
          );

        totalCost+=
          qty*b.price;

        remaining-=qty;

      }

      t.pl=
        (t.price*t.shares)-
        totalCost;

    }

  });

}


function render(){

  document.getElementById(
    "cash"
  ).textContent=
    money(cash);

  let marketValue=0;

  Object.keys(holdings)
    .forEach(s=>{

      marketValue+=
        (holdings[s]||0)*
        prices[s];

    });

  const equity=
    cash+marketValue;

  const totalPL=
    equity-10000;

  document.getElementById(
    "equity"
  ).textContent=
    money(equity);

  const plElement=
    document.getElementById(
      "totalPL"
    );

  plElement.textContent=
    money(totalPL);

  plElement.className=
    totalPL>=0
    ?"profit"
    :"loss";

  renderStocks();

  renderPositions();

  renderHistory();

  drawChart();

  save();

}


function renderStocks(){

  const box=
    document.getElementById(
      "stocks"
    );

  box.innerHTML="";

  symbols.forEach(s=>{

    const previous=
      candles[s] &&
      candles[s].length>1
      ?candles[s][
        candles[s].length-2
      ].close
      :prices[s];

    const direction=
      prices[s]>=previous
      ?"up"
      :"down";

    box.innerHTML+=`

      <div
        class="stock"
        onclick="selectStock('${s}')"
      >

        <b>${s}</b>

        <div class="price ${direction}">
          ${money(prices[s])}
        </div>

      </div>

    `;

  });

}


function selectStock(s){

  chartSymbol=s;

  document.getElementById(
    "chartSymbol"
  ).value=s;

  document.getElementById(
    "tradeSymbol"
  ).value=s;

  drawChart();

}


function changeChart(){

  chartSymbol=
    document.getElementById(
      "chartSymbol"
    ).value;

  document.getElementById(
    "tradeSymbol"
  ).value=
    chartSymbol;

  drawChart();

}


function executeTrade(
  action,
  symbol,
  shares
){

  shares=Number(shares);

  if(
    !symbol ||
    shares<=0
  ){

    alert(
      "Enter a valid number of shares."
    );

    return;

  }

  const price=
    prices[symbol];


  if(action==="BUY"){

    const cost=
      price*shares;

    if(cost>cash){

      alert(
        "Not enough cash."
      );

      return;

    }

    const confirmed=
      confirm(
        `BUY ${shares} ${symbol} at ${money(price)}?`
      );

    if(!confirmed)
      return;

    cash-=cost;

    holdings[symbol]=
      (holdings[symbol]||0)+
      shares;

    if(!costBasis[symbol])
      costBasis[symbol]=[];

    for(
      let i=0;
      i<shares;
      i++
    ){

      costBasis[symbol]
        .push(price);

    }

    trades.unshift({

      action:"BUY",
      symbol,
      shares,
      price,
      pl:0,
      time:
        new Date().toISOString()

    });

    alert(
      `BUY completed: ${shares} ${symbol} at ${money(price)}`
    );

  }


  else{

    if(
      (holdings[symbol]||0)<
      shares
    ){

      alert(
        "You do not own enough shares."
      );

      return;

    }

    const confirmed=
      confirm(
        `SELL ${shares} ${symbol} at ${money(price)}?`
      );

    if(!confirmed)
      return;

    let totalCost=0;

    if(!costBasis[symbol])
      costBasis[symbol]=[];

    for(
      let i=0;
      i<shares;
      i++
    ){

      if(
        costBasis[symbol].length
      ){

        totalCost+=
          costBasis[symbol]
            .shift();

      }else{

        totalCost+=price;

      }

    }

    const proceeds=
      price*shares;

    const pl=
      proceeds-totalCost;

    cash+=proceeds;

    holdings[symbol]-=
      shares;

    if(
      holdings[symbol]<=0
    ){

      delete holdings[symbol];

    }

    trades.unshift({

      action:"SELL",
      symbol,
      shares,
      price,
      pl,
      time:
        new Date().toISOString()

    });

    alert(
      `SELL completed: ${shares} ${symbol}\n`+
      `Realized P/L: ${money(pl)}`
    );

  }

  render();

}


function trade(action){

  const symbol=
    document.getElementById(
      "tradeSymbol"
    ).value;

  const shares=
    Number(
      document.getElementById(
        "shares"
      ).value
    );

  executeTrade(
    action,
    symbol,
    shares
  );

}


function chartTrade(action){

  const shares=
    Number(
      document.getElementById(
        "shares"
      ).value
    );

  executeTrade(
    action,
    chartSymbol,
    shares
  );

}


function renderPositions(){

  const box=
    document.getElementById(
      "positions"
    );

  box.innerHTML="";

  const list=
    Object.keys(holdings);

  if(!list.length){

    box.innerHTML=
      `<div class="empty">
        No open positions
      </div>`;

    return;

  }

  list.forEach(s=>{

    const shares=
      holdings[s];

    const basisArray=
      costBasis[s]||[];

    let entry=0;

    if(basisArray.length){

      entry=
        basisArray.reduce(
          (a,b)=>a+b,
          0
        )/
        basisArray.length;

    }

    const current=
      prices[s];

    const unrealized=
      (current-entry)*shares;

    const value=
      current*shares;

    const cls=
      unrealized>=0
      ?"profit"
      :"loss";

    box.innerHTML+=`

      <div class="position">

        <div class="positionHead">

          <b>${s}</b>

          <span class="${cls}">
            ${money(unrealized)}
          </span>

        </div>

        <div class="positionGrid">

          <div class="stat">
            <small>Shares</small>
            ${shares}
          </div>

          <div class="stat">
            <small>Entry</small>
            ${money(entry)}
          </div>

          <div class="stat">
            <small>Current</small>
            ${money(current)}
          </div>

          <div class="stat">
            <small>Value</small>
            ${money(value)}
          </div>

        </div>

        <div
          style="margin-top:10px;font-size:13px"
        >

          Stop Loss:
          ${
            risk.stopLoss[s]
            ?money(
              risk.stopLoss[s]
            )
            :"Not set"
          }

          &nbsp; | &nbsp;

          Take Profit:
          ${
            risk.takeProfit[s]
            ?money(
              risk.takeProfit[s]
            )
            :"Not set"
          }

        </div>

      </div>

    `;

  });

}


function saveRisk(){

  const sl=
    Number(
      document.getElementById(
        "stopLoss"
      ).value
    );

  const tp=
    Number(
      document.getElementById(
        "takeProfit"
      ).value
    );

  if(!risk.stopLoss)
    risk.stopLoss={};

  if(!risk.takeProfit)
    risk.takeProfit={};

  if(sl>0)
    risk.stopLoss[
      chartSymbol
    ]=sl;

  if(tp>0)
    risk.takeProfit[
      chartSymbol
    ]=tp;

  save();

  document.getElementById(
    "riskMessage"
  ).textContent=
    `Risk settings saved for ${chartSymbol}.`;

  document.getElementById(
    "stopLoss"
  ).value="";

  document.getElementById(
    "takeProfit"
  ).value="";

  render();

}


function checkRisk(){

  Object.keys(holdings)
    .forEach(s=>{

      const price=
        prices[s];

      const sl=
        risk.stopLoss &&
        risk.stopLoss[s];

      const tp=
        risk.takeProfit &&
        risk.takeProfit[s];


      if(
        sl &&
        price<=sl
      ){

        const shares=
          holdings[s];

        if(shares>0){

          alert(
            `STOP LOSS triggered for ${s} at ${money(price)}`
          );

          executeTrade(
            "SELL",
            s,
            shares
          );

          delete risk.stopLoss[s];

        }

      }

      else if(
        tp &&
        price>=tp
      ){

        const shares=
          holdings[s];

        if(shares>0){

          alert(
            `TAKE PROFIT triggered for ${s} at ${money(price)}`
          );

          executeTrade(
            "SELL",
            s,
            shares
          );

          delete risk.takeProfit[s];

        }

      }

    });

}


function updatePrices(){

  symbols.forEach(s=>{

    const arr=
      candles[s];

    const previous=
      arr[arr.length-1].close;

    const open=
      previous;

    const change=
      (Math.random()-.5)*4;

    const close=
      Math.max(
        1,
        open+change
      );

    const high=
      Math.max(
        open,
        close
      )+
      Math.random()*2;

    const low=
      Math.max(
        1,
        Math.min(
          open,
          close
        )-
        Math.random()*2
      );

    arr.push({

      open,
      high,
      low,
      close

    });

    if(arr.length>50)
      arr.shift();

    prices[s]=close;

  });

  checkRisk();

  render();

}


function drawChart(){

  const canvas=
    document.getElementById(
      "chart"
    );

  const ctx=
    canvas.getContext("2d");

  const box=
    canvas.getBoundingClientRect();

  const dpr=
    window.devicePixelRatio||1;

  canvas.width=
    box.width*dpr;

  canvas.height=
    box.height*dpr;

  ctx.scale(dpr,dpr);

  const width=
    box.width;

  const height=
    box.height;

  ctx.clearRect(
    0,
    0,
    width,
    height
  );

  const data=
    candles[chartSymbol]||[];

  if(!data.length)
    return;

  const padding={
    left:10,
    right:65,
    top:20,
    bottom:35
  };

  const chartW=
    width-
    padding.left-
    padding.right;

  const chartH=
    height-
    padding.top-
    padding.bottom;

  let min=
    Math.min(
      ...data.map(c=>c.low)
    );

  let max=
    Math.max(
      ...data.map(c=>c.high)
    );

  const range=
    max-min||1;

  min-=range*.05;
  max+=range*.05;


  function y(v){

    return padding.top+
      (max-v)/
      (max-min)*
      chartH;

  }


  function x(i){

    return padding.left+
      i*
      (chartW/data.length)+
      chartW/
      data.length/
      2;

  }


  ctx.strokeStyle="#e5e7eb";

  ctx.lineWidth=1;


  for(
    let i=0;
    i<=5;
    i++
  ){

    const yy=
      padding.top+
      i*chartH/5;

    ctx.beginPath();

    ctx.moveTo(
      padding.left,
      yy
    );

    ctx.lineTo(
      padding.left+
      chartW,
      yy
    );

    ctx.stroke();

    const value=
      max-
      i*
      (max-min)/5;

    ctx.fillStyle="#6b7280";

    ctx.font=
      "11px Arial";

    ctx.fillText(
      money(value),
      width-60,
      yy+4
    );

  }


  const candleW=
    Math.max(
      3,
      chartW/
      data.length*
      .55
    );


  data.forEach((c,i)=>{

    const xx=x(i);

    const rising=
      c.close>=c.open;

    ctx.strokeStyle=
      rising
      ?" #16a34a"
      :"#dc2626";

    ctx.fillStyle=
      rising
      ?" #16a34a"
      :"#dc2626";

    ctx.beginPath();

    ctx.moveTo(
      xx,
      y(c.high)
    );

    ctx.lineTo(
      xx,
      y(c.low)
    );

    ctx.stroke();

    const top=
      Math.min(
        y(c.open),
        y(c.close)
      );

    const bottom=
      Math.max(
        y(c.open),
        y(c.close)
      );

    ctx.fillRect(
      xx-candleW/2,
      top,
      candleW,
      Math.max(
        1,
        bottom-top
      )
    );

  });


  const current=
    prices[chartSymbol];

  const currentY=
    y(current);

  ctx.setLineDash([
    5,
    5
  ]);

  ctx.strokeStyle=
    "#6b7280";

  ctx.beginPath();

  ctx.moveTo(
    padding.left,
    currentY
  );

  ctx.lineTo(
    padding.left+
    chartW,
    currentY
  );

  ctx.stroke();

  ctx.setLineDash([]);

  ctx.fillStyle=
    "#111827";

  ctx.font=
    "bold 12px Arial";

  ctx.fillText(
    money(current),
    width-60,
    currentY-5
  );


  document.getElementById(
    "chartTitle"
  ).textContent=
    chartSymbol;

  document.getElementById(
    "chartPrice"
  ).textContent=
    money(current);


  const last=
    data[data.length-1];

  document.getElementById(
    "ohlc"
  ).innerHTML=`

    <b>Open</b> ${money(last.open)}
    &nbsp;&nbsp;

    <b>High</b> ${money(last.high)}
    &nbsp;&nbsp;

    <b>Low</b> ${money(last.low)}
    &nbsp;&nbsp;

    <b>Close</b> ${money(last.close)}

    <br>

    <span style="color:#6b7280">
      Simulated market • New candle every 5 seconds
    </span>

  `;

}


function renderHistory(){

  const box=
    document.getElementById(
      "history"
    );

  box.innerHTML="";

  if(!trades.length){

    box.innerHTML=
      `<div class="empty">
        No trades yet
      </div>`;

    return;

  }


  trades
    .slice(0,30)
    .forEach(t=>{

      let plText="";


      if(t.action==="SELL"){

        const pl=
          Number(t.pl)||0;

        plText=`

          <div class="${
            pl>=0
            ?"profit"
            :"loss"
          }">

            Realized P/L:
            ${money(pl)}

          </div>

        `;

      }


      let dateText="";


      if(t.time){

        const parsed=
          new Date(t.time);

        if(
          !isNaN(
            parsed.getTime()
          )
        ){

          dateText=
            parsed.toLocaleString();

        }

      }


      if(!dateText){

        dateText=
          "Previous trade";

      }


      box.innerHTML+=`

        <div class="history">

          <b class="${
            t.action==="BUY"
            ?"up"
            :"down"
          }">

            ${t.action}

          </b>

          ${t.shares}
          ${t.symbol}
          @ ${money(t.price)}

          ${plText}

          <small>
            ${dateText}
          </small>

        </div>

      `;

    });

}


function resetAccount(){

  const confirmed=
    confirm(
      "Reset the account to $10,000 and delete all trading history?"
    );

  if(!confirmed)
    return;

  localStorage.removeItem(
    "martinTrade"
  );

  cash=10000;

  prices={
    ...startingPrices
  };

  holdings={};

  trades=[];

  candles={};

  costBasis={};

  risk={
    stopLoss:{},
    takeProfit:{}
  };

  initializeCandles();

  render();

}


load();

render();

setInterval(
  updatePrices,

);

window.addEventListener(

  drawChart
);

</script>
