<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Martin Trade</title>

<style>
body{
  font-family:Arial;
  background:#f4f6f8;
  margin:0;
  color:#172033;
}
header{
  background:#111827;
  color:white;
  padding:18px;
  text-align:center;
}
.container{
  max-width:700px;
  margin:auto;
  padding:15px;
}
.card{
  background:white;
  padding:18px;
  margin:12px 0;
  border-radius:12px;
  box-shadow:0 2px 8px #ddd;
}
input,select,button{
  width:100%;
  padding:12px;
  margin:6px 0;
  box-sizing:border-box;
  border-radius:7px;
  border:1px solid #ccc;
}
button{
  border:0;
  color:white;
  font-weight:bold;
  cursor:pointer;
}
.buy{background:#16a34a}
.sell{background:#dc2626}
.reset{background:#555}
.stock{
  display:inline-block;
  width:45%;
  margin:5px;
}
table{
  width:100%;
  border-collapse:collapse;
}
td,th{
  padding:8px;
  border-bottom:1px solid #ddd;
  text-align:left;
}
</style>
</head>

<body>

<header>
<h1>Martin Trade</h1>
<p>Paper Trading • Virtual Money</p>
</header>

<div class="container">

<div class="card">
<h2>Account</h2>
<p>Cash: $<span id="cash">10000.00</span></p>
<p>Portfolio: $<span id="portfolio">10000.00</span></p>
<p>Total P/L: $<span id="profit">0.00</span></p>
</div>

<div class="card">
<h2>Stocks</h2>
<div id="stocks"></div>
</div>

<div class="card">
<h2>Place Trade</h2>

<select id="symbol">
<option>AAPL</option>
<option>MSFT</option>
<option>NVDA</option>
<option>TSLA</option>
<option>AMZN</option>
<option>GOOGL</option>
</select>

<input id="shares" type="number" min="1" value="1">

<button class="buy" onclick="trade('BUY')">BUY</button>
<button class="sell" onclick="trade('SELL')">SELL</button>
</div>

<div class="card">
<h2>Portfolio</h2>
<div id="portfolioList">No positions</div>
</div>

<div class="card">
<h2>Trade History</h2>
<div id="history">No trades</div>
</div>

<div class="card">
<button class="reset" onclick="resetAccount()">Reset Account</button>
</div>

</div>

<script>

let cash=10000;
let startingCash=10000;

let prices={
 AAPL:256.77,
 MSFT:521.90,
 NVDA:180.24,
 TSLA:447.96,
 AMZN:232.11,
 GOOGL:246.85
};

let holdings={};
let trades=[];

function money(n){
 return Number(n).toFixed(2);
}

function render(){

 document.getElementById("cash").textContent=money(cash);

 let stockValue=0;

 for(let s in holdings){
   stockValue+=holdings[s].shares*prices[s];
 }

 let portfolio=cash+stockValue;
 let profit=portfolio-startingCash;

 document.getElementById("portfolio").textContent=money(portfolio);
 document.getElementById("profit").textContent=money(profit);

 let stocks="";

 for(let s in prices){
   stocks+=`
   <div class="stock">
   <b>${s}</b><br>
   $${money(prices[s])}
   </div>`;
 }

 document.getElementById("stocks").innerHTML=stocks;

 let p="";

 for(let s in holdings){
   p+=`${s}: ${holdings[s].shares} shares<br>`;
 }

 document.getElementById("portfolioList").innerHTML=
   p || "No positions";

 let h="";

 trades.slice().reverse().forEach(t=>{
   h+=`${t.action} ${t.shares} ${t.symbol} @ $${money(t.price)}<br>`;
 });

 document.getElementById("history").innerHTML=
   h || "No trades";
}

function trade(action){

 let symbol=document.getElementById("symbol").value;
 let shares=Number(document.getElementById("shares").value);
 let price=prices[symbol];

 if(shares<1){
   alert("Enter at least 1 share");
   return;
 }

 if(action==="BUY"){

   let cost=price*shares;

   if(cost>cash){
     alert("Not enough cash");
     return;
   }

   cash-=cost;

   if(!holdings[symbol]){
     holdings[symbol]={shares:0};
   }

   holdings[symbol].shares+=shares;
 }

 else{

   if(!holdings[symbol] ||
      holdings[symbol].shares<shares){

     alert("You don't own enough shares");
     return;
   }

   cash+=price*shares;
   holdings[symbol].shares-=shares;

   if(holdings[symbol].shares===0){
     delete holdings[symbol];
   }
 }

 trades.push({
   action:action,
   symbol:symbol,
   shares:shares,
   price:price
 });

 save();
 render();
}

function save(){
 localStorage.setItem(
   "martinTrade",
   JSON.stringify({
     cash:cash,
     holdings:holdings,
     trades:trades
   })
 );
}

function load(){

 let data=localStorage.getItem("martinTrade");

 if(data){
   data=JSON.parse(data);
   cash=data.cash;
   holdings=data.holdings;
   trades=data.trades;
 }
}

function resetAccount(){

 if(confirm("Reset your account?")){

   cash=startingCash;
   holdings={};
   trades=[];

   save();
   render();
 }
}

load();
render();

</script>

</body>
</html>
