<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0f172a">
<title>Martin Trade — Paper Trading</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f7fb;
  color:#172033
}

header{
  background:#0f172a;
  color:white;
  padding:18px 20px
}

header h1{
  margin:0;
  font-size:25px
}

header p{
  margin:5px 0;
  color:#cbd5e1;
  font-size:13px
}

.status{
  display:inline-block;
  margin-top:10px;
  padding:6px 10px;
  border-radius:20px;
  background:#064e3b;
  color:#6ee7b7;
  font-size:12px
}

.container{
  max-width:1200px;
  margin:auto;
  padding:18px
}

.summary{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
  margin-bottom:18px
}

.card,.panel{
  background:white;
  border-radius:14px;
  padding:16px;
  box-shadow:0 2px 10px rgba(15,23,42,.07)
}

.card h3{
  margin:0 0 7px;
  font-size:13px;
  color:#64748b
}

.value{
  font-size:24px;
  font-weight:700
}

.positive{color:#059669}
.negative{color:#dc2626}

.section-title{
  margin:22px 0 10px;
  font-size:18px
}

.markets{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px
}

.market{
  background:white;
  border:2px solid transparent;
  border-radius:13px;
  padding:14px;
  cursor:pointer;
  box-shadow:0 2px 8px rgba(15,23,42,.05)
}

.market.active{
  border-color:#2563eb
}

.market-top{
  display:flex;
  justify-content:space-between
}

.symbol{
  font-size:17px;
  font-weight:700
}

.company{
  font-size:12px;
  color:#64748b;
  margin-top:3px
}

.price{
  font-weight:700;
  font-size:16px
}

.change{
  font-size:12px;
  margin-top:4px
}

.trade-grid{
  display:grid;
  grid-template-columns:1.35fr .9fr;
  gap:14px;
  margin-top:18px
}

.panel h2{
  margin:0 0 14px;
  font-size:18px
}

.chart-wrap{
  height:220px;
  background:#f8fafc;
  border-radius:10px;
  padding:8px
}

canvas{
  width:100%;
  height:100%
}

.trade-info{
  display:flex;
  justify-content:space-between;
  margin-bottom:12px;
  padding:10px;
  background:#f8fafc;
  border-radius:10px
}

label{
  display:block;
  font-size:13px;
  color:#64748b;
  margin:12px 0 6px
}

input{
  width:100%;
  padding:12px;
  border:1px solid #cbd5e1;
  border-radius:9px;
  font-size:16px
}

.buttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:14px
}

button{
  border:0;
  border-radius:9px;
  padding:12px;
  font-size:15px;
  font-weight:700;
  cursor:pointer
}

.buy{
  background:#059669;
  color:white
}

.sell{
  background:#dc2626;
  color:white
}

.secondary{
  background:#e2e8f0;
  color:#172033;
  width:100%;
  margin-top:10px
}

.note{
  font-size:12px;
  color:#64748b;
  margin-top:10px;
  line-height:1.4
}

.table-wrap{
  overflow-x:auto
}

table{
  width:100%;
  border-collapse:collapse;
  font-size:13px
}

th,td{
  text-align:left;
  padding:10px;
  border-bottom:1px solid #e2e8f0;
  white-space:nowrap
}

th{
  color:#64748b;
  font-size:12px
}

.empty{
  text-align:center;
  color:#64748b;
