<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Martin Trade</title>

<style>
body{font-family:Arial;margin:0;background:#f4f6f8;color:#172033}
header{background:#111827;color:white;padding:18px;text-align:center}
main{max-width:700px;margin:auto;padding:15px}
.card{background:white;padding:18px;margin:12px 0;border-radius:12px;box-shadow:0 2px 8px #ddd}
input,select,button{width:100%;padding:12px;margin:6px 0;box-sizing:border-box;border-radius:7px;border:1px solid #ccc}
button{border:0;color:white;font-weight:bold}
.buy{background:#16a34a}.sell{background:#dc2626}.reset{background:#555}
.stock{display:inline-block;width:44%;padding:8px}
</style>
</head>

<body>

<header>
<h1>Martin Trade</h1>
<p>Paper Trading • Virtual Money</p>
</header>

<main>

<div class="card">
<h2>Account</h2>
<p>Cash: $<span id="cash">10000.00</span></p>
<p>Portfolio: $<span id="portfolio">10000.00</span></p>
<p>Total P/L: $<span id="profit">0.00</span></p>
</div>

<div class="card">
<h2>Stocks</h2>
<div id="stocks"></div>
</div>

<div class="card">
<h2>Place Trade</h2>

<select id="symbol">
<option>AAPL</option>
<option>MSFT</option>
<option>NVDA</option>
<option>TSLA</option>
<option>AMZN</option>
<option>GOOGL</option>
</select>

<input id="shares" type="number" min="1" value="1">

<button class="buy" onclick="trade('BUY')">BUY</button>
<button class="sell" onclick="trade('SELL')">SELL</button>
</div>

<div class="card">
<h2>Portfolio</h2>
<div id="portfolioList">No positions</div>
</div>

<div class="card">
<h2>Trade History</h2>
<div id="history">No trades</div>
</div>

<div class="card">
<button class="reset" onclick="resetAccount()">Reset Account</button>
</div>

</main>

<script>
let cash=10000;
let prices={
 AAPL:256.77,MSFT:521.90,NVDA:180.24,
 TSLA:447.96,AMZN:232.11,GOOGL:246.85
};
let holdings={};
let trades=[];

function money(n){
 return Number(n).toFixed(2);
}

function render(){

 document.getElementById("cash").textContent=money(cash);

 let value=0;

 for(let s in holdings)
   value+=holdings[s]*prices[s];

 let portfolio=cash+value;

 document.getElementById("portfolio").textContent=money(portfolio);
 document.getElementById("profit").textContent=money(portfolio-10000);

 let stocks="";

 for(let s in prices)
   stocks+=`<div class="stock"><b>${s}</b><br>$${money(prices[s])}</div>`;

 document.getElementById("stocks").innerHTML=stocks;

 let p="";

 for(let s in holdings)
   p+=`${s}: ${holdings[s]} shares<br>`;

 document.getElementById("portfolioList").innerHTML=p||"No positions";

 let h="";

 trades.slice().reverse().forEach(t=>{
   h+=`${t.action} ${t.shares} ${t.symbol} @ $${money(t.price)}<br>`;
 });

 document.getElementById("history").innerHTML=h||"No trades";

 save();
}

function trade(action){

 let symbol=document.getElementById("symbol").value;
 let shares=Number(document.getElementById("shares").value);
 let price=prices[symbol];

 if(shares<1){
   alert("Enter at least 1 share");
   return;
 }

 if(action==="BUY"){

   if(price*shares>cash){
     alert("Not enough cash");
     return;
   }

   cash-=price*shares;
   holdings[symbol]=(holdings[symbol]||0)+shares;

 }else{

   if(!holdings[symbol]||holdings[symbol]<shares){
     alert("You don't own enough shares");
     return;
   }

   cash+=price*shares;
   holdings[symbol]-=shares;

   if(holdings[symbol]===0)
     delete holdings[symbol];
 }

 trades.push({action,symbol,shares,price});
 render();
}

function updatePrices(){

 for(let s in prices){
   prices[s]=Math.max(
     1,
     prices[s]+(Math.random()-.5)*2
   );
 }

 render();
}

function save(){

 localStorage.setItem("martinTrade",
 JSON.stringify({
   cash,holdings,trades
 }));
}

function load(){

 let data=localStorage.getItem("martinTrade");

 if(data){
   data=JSON.parse(data);
   cash=data.cash;
   holdings=data.holdings;
   trades=data.trades;
 }
}

function resetAccount(){

 if(confirm("Reset your account?")){

   cash=10000;
   holdings={};
   trades=[];

   localStorage.removeItem("martinTrade");
   render();
 }
}

load();
render();

setInterval(updatePrices,5000);
</script>

</body>
</html>
