<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Martin Trade — Paper Trading</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f5f7fb;
  color:#172033;
}

header{
  background:#111827;
  color:white;
  padding:18px 20px;
}

header h1{
  margin:0 0 6px;
  font-size:24px;
}

header p{
  margin:0;
  color:#cbd5e1;
  font-size:14px;
}

.status{
  display:inline-block;
  margin-top:10px;
  background:#064e3b;
  color:#6ee7b7;
  padding:6px 10px;
  border-radius:20px;
  font-size:12px;
}

.container{
  max-width:1200px;
  margin:auto;
  padding:18px;
}

.summary{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:14px;
  margin-bottom:18px;
}

.card{
  background:white;
  border-radius:12px;
  padding:18px;
  box-shadow:0 2px 8px rgba(0,0,0,.06);
}

.card h3{
  margin:0 0 8px;
  font-size:14px;
  color:#64748b;
}

.value{
  font-size:25px;
  font-weight:bold;
}

.markets{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
  margin-bottom:20px;
}

.market{
  background:white;
  border-radius:12px;
  padding:16px;
  cursor:pointer;
  border:2px solid transparent;
  box-shadow:0 2px 8px rgba(0,0,0,.05);
}

.market:hover{
  border-color:#2563eb;
}

.market.active{
  border-color:#2563eb;
}
